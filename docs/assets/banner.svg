<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12245e"/>
      <stop offset="0.5" stop-color="#2f6fed"/>
      <stop offset="1" stop-color="#5aa0ff"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd66b"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0a1a4a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1600" height="420" fill="url(#bg)"/>
  <circle cx="1420" cy="40" r="190" fill="#ffffff" opacity="0.07"/>
  <circle cx="1520" cy="360" r="120" fill="#ffffff" opacity="0.06"/>
  <circle cx="150" cy="410" r="150" fill="#ffffff" opacity="0.05"/>

  <!-- browser window card -->
  <g filter="url(#soft)">
    <rect x="80" y="80" width="440" height="260" rx="20" fill="#ffffff"/>
  </g>
  <rect x="80" y="80" width="440" height="44" rx="20" fill="#eef3ff"/>
  <rect x="80" y="104" width="440" height="20" fill="#eef3ff"/>
  <circle cx="112" cy="102" r="8" fill="#ff5f57"/>
  <circle cx="140" cy="102" r="8" fill="#febc2e"/>
  <circle cx="168" cy="102" r="8" fill="#28c840"/>

  <!-- document (pdf) -->
  <g>
    <path d="M140 168 h92 l40 40 v136 a10 10 0 0 1 -10 10 h-122 a10 10 0 0 1 -10 -10 v-166 a10 10 0 0 1 10 -10 z" fill="#e8f0fe" stroke="#2f6fed" stroke-width="4"/>
    <path d="M232 168 l40 40 h-40 z" fill="#bcd3fb" stroke="#2f6fed" stroke-width="4" stroke-linejoin="round"/>
    <line x1="164" y1="248" x2="248" y2="248" stroke="#9dbdf5" stroke-width="7" stroke-linecap="round"/>
    <line x1="164" y1="278" x2="248" y2="278" stroke="#9dbdf5" stroke-width="7" stroke-linecap="round"/>
    <line x1="164" y1="308" x2="216" y2="308" stroke="#9dbdf5" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- chain link -->
  <g stroke="url(#arrow)" stroke-width="9" fill="none" stroke-linecap="round">
    <rect x="322" y="206" width="54" height="34" rx="17" transform="rotate(-35 349 223)"/>
    <rect x="360" y="242" width="54" height="34" rx="17" transform="rotate(-35 387 259)"/>
  </g>

  <!-- download arrow -->
  <g>
    <line x1="452" y1="176" x2="452" y2="268" stroke="url(#arrow)" stroke-width="14" stroke-linecap="round"/>
    <path d="M424 252 L452 292 L480 252" fill="none" stroke="url(#arrow)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M416 312 h72" stroke="#2f6fed" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- text -->
  <text x="580" y="182" fill="#ffffff" font-size="66" font-weight="800" letter-spacing="1">安医 PDF 课件直链下载法</text>
  <text x="584" y="238" fill="#dbe7ff" font-size="31" font-weight="500">media.ahmu.edu.cn · 浏览器控制台 · 三步取真实直链</text>

  <!-- pill badges -->
  <g font-size="26" font-weight="700">
    <rect x="584" y="272" width="188" height="52" rx="26" fill="#ffffff" opacity="0.16"/>
    <text x="678" y="306" fill="#ffffff" text-anchor="middle">无需安装</text>
    <rect x="788" y="272" width="230" height="52" rx="26" fill="#ffffff" opacity="0.16"/>
    <text x="903" y="306" fill="#ffffff" text-anchor="middle">F12 Console</text>
    <rect x="1034" y="272" width="150" height="52" rx="26" fill="#ffd66b"/>
    <text x="1109" y="306" fill="#7a4b00" text-anchor="middle">MIT</text>
  </g>
</svg>
